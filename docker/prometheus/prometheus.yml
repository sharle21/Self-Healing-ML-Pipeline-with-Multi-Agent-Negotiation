global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'self-healing-pipeline'

scrape_configs:
  - job_name: 'self-healing-api'
    static_configs:
      - targets: ['localhost:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'self-healing-commander'
    static_configs:
      - targets: ['localhost:8002']
    metrics_path: '/metrics'
    scrape_interval: 10s
